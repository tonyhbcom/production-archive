name: Publish to Comfy registry

# 什么时候触发：
#   1) push 到 main 且改动了 pyproject.toml（也就是你改了版本号）
#   2) 也可以在 GitHub 网页上手动点 "Run workflow"
#
# 为什么用这个方式而不是本地 `comfy node publish`：
#   把 API Key 存在 GitHub Secret 里，不用每次手动输；
#   而且以后发新版 = 改个版本号 push 一下，剩下自动。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Secret 没建时给一句人话 —— 否则报错信息让人完全摸不着头脑
      - name: Check REGISTRY_ACCESS_TOKEN
        env:
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing Secret::REGISTRY_ACCESS_TOKEN is not set. Go to Settings > Secrets and variables > Actions > New repository secret, and use the API key from registry.comfy.org"
            exit 1
          fi
          echo "Secret is configured."

      - name: Publish Custom Node
        # ★ 用 @main，不要固定版本 —— 这里踩过一次坑：
        # 固定到 1.0.1 后 CI 直接失败（exit code 2，30 秒内）。
        # 原因：这个 action 内部跑 `pip install comfy-cli`（永远装最新版），
        # 而 1.0.1 里写的是 `comfy --yes env` —— 新版 comfy-cli 不再接受 --yes，
        # click 类 CLI 遇非法参数就退 2。main 已改成
        # `comfy --skip-prompt --no-enable-telemetry env`。
        # 官方文档用的也是 @main。**跟着上游走，别自作聪明钉版本。**
        # （如果哪天要钉，钉 commit SHA，别钉 release tag —— tag 和 comfy-cli
        #   的最新版会错位，而 action 自己不锁 comfy-cli 版本。）
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
