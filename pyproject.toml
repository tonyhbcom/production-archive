[project]
name = "production-archive"
description = "把 ComfyUI 输出文件里内嵌的提示词与工作流汇总成一份可搜索、可归类、可预览的档案。"
version = "1.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/tonyhbcom/production-archive"
Homepage = "https://github.com/tonyhbcom/production-archive"

[tool.comfy]
PublisherId = "tonyhbcom"
DisplayName = "Production Archive"
# 图标已随包提供：icon.png（400x400，Registry/Manager 列表里显示的就是它）+ icon.svg（矢量源）。
# 用 raw 直链 —— Registry 与 ComfyUI Manager 都能直接取到。
Icon = "https://raw.githubusercontent.com/tonyhbcom/production-archive/main/icon.png"
# Banner 留空：没有合适的横版宣传图，宁可空着也不放一张糊的。
Banner = ""
